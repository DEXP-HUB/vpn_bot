[pytest]
# Путь к исходному коду
pythonpath = src

# Для асинхронных тестов
asyncio_mode = auto

# Паттерны поиска тестов
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Исключения из покрытия
norecursedirs = 
    .venv
    .git
    __pycache__
    .cursor
    .vscode

# Настройка логирования
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S